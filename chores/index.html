<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1219">
<title>מטלות הבית</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-pokeball-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1219; --card:#121F2A; --card2:#182835; --line:#233747;
    --ink:#EAF2F7; --muted:#8FA3B3;
    --mint:#33D6C0; --ember:#FF8552; --gold:#FFC947; --pink:#FF6B88; --sky:#5BB7FF; --violet:#A996FF;
    --kc:var(--mint);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:Rubik,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; padding-bottom:calc(env(safe-area-inset-bottom) + 32px);
  }
  h1,h2,h3,.display{font-family:"Secular One",Rubik,sans-serif;font-weight:400}
  button{font:inherit;color:inherit;cursor:pointer}
  [hidden]{display:none !important}
  .en{direction:ltr;unicode-bidi:isolate}

  header{
    position:sticky;top:0;z-index:5;background:rgba(10,18,25,.92);backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;border-bottom:1px solid var(--line);
  }
  .hrow{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:22px;flex:1}
  .helpBtn{
    width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
    color:var(--gold);font-weight:800;font-size:16px;line-height:1;flex:none
  }

  /* how-it-works cards: a horizontal scroll-snap deck, like the evening routine one */
  .help{position:fixed;inset:0;z-index:28;background:var(--bg);display:flex;flex-direction:column}
  .help .top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}
  .help .top b{font-family:"Secular One",sans-serif;font-weight:400;font-size:18px;color:var(--muted)}
  .help .x{background:none;border:none;font-size:26px;color:var(--muted);padding:4px 8px;line-height:1}
  .track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
  .track::-webkit-scrollbar{display:none}
  .slide{
    flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;padding:12px 28px 24px;
  }
  .slide .ill{font-size:84px;line-height:1.1;margin-bottom:18px;min-height:96px;display:flex;align-items:center;justify-content:center;gap:4px}
  .slide .ill img{width:84px;height:84px;object-fit:contain}
  .slide .ill .arr{font-size:22px;color:var(--muted)}
  .slide h2{font-size:30px;margin:0 0 12px;color:var(--c,var(--mint))}
  .slide p{font-size:17px;line-height:1.6;margin:0 0 10px;max-width:420px;color:var(--ink)}
  .slide p.s{font-size:14px;color:var(--muted)}
  .slide .steps{list-style:none;padding:0;margin:4px 0 0;text-align:right;font-size:17px;line-height:1.5;max-width:340px}
  .slide .steps li{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .slide .steps i{
    flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,var(--mint));color:#0A1219;
    font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px
  }
  .help .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px calc(env(safe-area-inset-bottom) + 18px)}
  .dots{display:flex;gap:7px}
  .dots span{width:8px;height:8px;border-radius:99px;background:var(--line);transition:.2s}
  .dots span.on{width:22px;background:var(--gold)}
  .help .next{min-width:110px}
  .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.live{background:var(--mint)} .dot.err{background:var(--pink)}
  .wrap{max-width:560px;margin:0 auto;padding:16px}

  .weekbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:4px 0 18px}
  .weekbar b{color:var(--gold);font-weight:600}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
  .sectionTitle{font-size:20px;margin:22px 0 12px}

  /* progress bar: fills right→left, tick at the first evolution */
  .bar{position:relative;height:8px;border-radius:99px;background:var(--line);margin:10px 0 8px}
  .bar i{position:absolute;top:0;bottom:0;right:0;border-radius:99px;background:var(--kc);transition:width .4s ease}
  .bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);border-radius:2px}

  /* kid picker */
  .kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kid{
    position:relative;text-align:right;background:var(--card);border:2px solid var(--kc);border-radius:22px;padding:16px 14px;
    transition:transform .12s ease;display:flex;flex-direction:column;
  }
  .kid:active{transform:scale(.97)}
  .kid .pk{position:absolute;top:8px;left:6px;width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  .kid .nm{font-family:"Secular One",sans-serif;font-size:28px;color:var(--kc);line-height:1.1}
  .kid .pn{font-size:12px;color:var(--muted);margin-top:2px}
  .kid .big{font-size:38px;font-weight:800;margin-top:12px;line-height:1}
  .kid .big small{font-size:16px;color:var(--muted);font-weight:600}
  .kid .st{font-size:12.5px;line-height:1.4;color:var(--muted);min-height:36px}
  .kid .st.nag{color:var(--pink)}
  .kid .earned{font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);line-height:1.6}
  .kid .earned b{color:var(--gold)}

  .tip{margin-top:18px;background:var(--card2);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5;color:var(--muted)}
  .tip b{color:var(--violet);display:block;font-weight:600;margin-bottom:2px}
  .ghost{
    display:block;width:100%;margin-top:18px;background:none;border:1px dashed var(--line);border-radius:16px;
    padding:14px;color:var(--muted);font-size:15px
  }

  /* kid view */
  .back{background:none;border:none;color:var(--muted);font-size:15px;padding:4px 0;margin-bottom:6px}
  .hero{display:flex;gap:14px;align-items:center;border-color:var(--kc)}
  .hero img{width:110px;height:110px;object-fit:contain;flex:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
  .hero .info{flex:1;min-width:0}
  .hero h2{margin:0;font-size:32px;color:var(--kc);line-height:1.1}
  .hero .pn{font-size:14px;color:var(--muted);margin-top:2px}
  .hero .cnt{font-size:14px;color:var(--muted);margin-top:8px}
  .hero .cnt b{color:var(--ink);font-size:20px}
  .countdown{font-size:14px;line-height:1.5;margin-top:2px}
  .shiny{font-size:12px;color:var(--gold);margin-top:6px}
  .nagbox{border-color:var(--pink);background:linear-gradient(135deg,rgba(255,107,136,.10),var(--card) 60%)}
  .nagbox .t{font-weight:700;font-size:16px}
  .nagbox .d{font-size:13px;color:var(--pink);margin:2px 0 8px}
  .nagbox .l{font-size:15px;line-height:1.5}
  .vcard{display:flex;gap:12px;align-items:center}
  .vcard img{width:64px;height:64px;object-fit:contain;flex:none}
  .vcard.yes{border-color:var(--mint)} .vcard.no{border-color:var(--line)}
  .vcard .t{font-weight:700;font-size:17px} .vcard.yes .t{color:var(--mint)}
  .vcard .s{font-size:13px;color:var(--muted);margin-top:2px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chore{
    position:relative;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px 14px 12px;min-height:104px;display:flex;flex-direction:column;gap:4px;transition:transform .12s ease,border-color .12s;
  }
  .chore:active{transform:scale(.97);border-color:var(--kc)}
  .chore .em{font-size:24px;line-height:1}
  .chore .t{font-weight:600;font-size:15px;line-height:1.3}
  .chore .h{font-size:12px;color:var(--muted);line-height:1.35}
  .chore .x{
    position:absolute;top:10px;left:10px;background:var(--kc);color:#0A1219;font-weight:800;font-size:12px;
    border-radius:999px;padding:2px 8px;
  }
  details.more{margin-top:14px}
  details.more summary{list-style:none;cursor:pointer;color:var(--muted);font-size:15px;padding:12px 4px}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::before{content:"＋ ";color:var(--kc)}
  details.more[open] summary::before{content:"－ "}
  .catTitle{font-size:13px;color:var(--muted);margin:14px 2px 8px}

  .done{list-style:none;margin:0;padding:0}
  .done li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .done li:first-child{border-top:none}
  .done .when{font-size:12px;color:var(--muted)}
  .undo{background:none;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:10px}

  /* parent view */
  .pin{display:flex;gap:10px}
  .pin input{
    flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--ink);
    font-size:20px;padding:12px 14px;text-align:center;letter-spacing:6px;font-family:inherit
  }
  .btn{border:none;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--mint);color:#0A1219}
  .btn:disabled{opacity:.5}
  .totals{display:flex;gap:10px}
  .totals div{flex:1;background:var(--card2);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--muted)}
  .totals b{display:block;font-size:22px;color:var(--gold);margin-top:2px}
  .wk h3{margin:0 0 4px;font-size:18px}
  .wk .sub{font-size:13px;color:var(--muted);margin-bottom:6px}
  .pk2{padding:12px 0;border-top:1px solid var(--line)}
  .pk2 .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pk2 .nm{font-weight:700;color:var(--kc);font-size:17px}
  .pk2 .n{color:var(--muted);font-size:14px}
  .pk2 .list{font-size:13px;color:var(--muted);margin:6px 0 10px;line-height:1.6}
  .dec{display:flex;gap:8px}
  .dec button{flex:1;border-radius:12px;padding:10px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card2)}
  .dec .yes{background:rgba(51,214,192,.14);border-color:var(--mint);color:var(--mint)}
  .dec .no{color:var(--muted)}
  .verdict{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
  .verdict.yes{background:rgba(51,214,192,.14);color:var(--mint)}
  .verdict.no{background:var(--card2);color:var(--muted)}
  .verdict button{background:none;border:none;color:var(--muted);font-size:12px;font-weight:400;text-decoration:underline}
  .linkish{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;margin-top:6px}

  /* setup */
  .setup input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    padding:12px;font-size:14px;direction:ltr;margin:10px 0
  }

  /* confirm sheet */
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet .box{
    width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;border-top:3px solid var(--kc);
    padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .18s ease-out
  }
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet .q{color:var(--muted);font-size:14px}
  .sheet .what{font-family:"Secular One",sans-serif;font-size:24px;margin:4px 0 18px}
  .sheet .acts{display:flex;gap:10px}
  .sheet .acts button{flex:1;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:700}
  .sheet .ok{background:var(--kc);color:#0A1219}
  .sheet .cancel{background:var(--card2)}

  /* big moments: evolution, shiny, Ilana's verdict */
  .ov{position:fixed;inset:0;z-index:25;background:rgba(5,10,15,.88);display:flex;align-items:center;justify-content:center;padding:24px}
  .ovBox{width:100%;max-width:380px;text-align:center;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
  .ovArt{position:relative;width:220px;height:220px;margin:0 auto}
  .ovArt img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
  .ovArt .big{font-size:120px;line-height:220px}
  .ovBox h2{font-size:30px;margin:14px 0 6px;color:var(--gold)}
  .ovBox p{font-size:17px;line-height:1.5;margin:0 0 22px;color:var(--ink)}
  .ovBox .btn{min-width:160px;font-size:17px;padding:14px 24px}
  /* evolution: the old form flickers white and swaps with the new one */
  .evo .from{animation:evoOut 2.4s ease-in forwards}
  .evo .to{opacity:0;animation:evoIn 2.4s ease-in forwards}
  @keyframes evoOut{
    0%{opacity:1;filter:brightness(1)} 30%{filter:brightness(4)} 40%,50%{opacity:1} 55%{opacity:0} 62%{opacity:1}
    70%{opacity:0} 76%{opacity:1} 82%,100%{opacity:0;filter:brightness(4)}
  }
  @keyframes evoIn{
    0%,50%{opacity:0;filter:brightness(4)} 55%{opacity:1} 62%{opacity:0} 70%{opacity:1} 76%{opacity:0}
    82%{opacity:1;filter:brightness(4)} 100%{opacity:1;filter:brightness(1)}
  }
  .shinyArt img{animation:sparkle 1.6s ease-in-out infinite alternate}
  @keyframes sparkle{from{filter:drop-shadow(0 0 6px var(--gold))}to{filter:drop-shadow(0 0 26px var(--gold)) brightness(1.15)}}
  .confetti{position:fixed;top:-20px;z-index:26;pointer-events:none;font-size:22px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;
    opacity:0;pointer-events:none;transition:.2s ease;z-index:30;max-width:calc(100% - 32px);text-align:center;line-height:1.4
  }
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toast.bad{background:var(--pink)}

  @media (max-width:360px){ .grid{grid-template-columns:1fr} .kid .nm{font-size:24px} .kid .pk{width:50px;height:50px} }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>מטלות הבית 🏠</h1>
    <button class="helpBtn" id="helpBtn" aria-label="איך זה עובד">?</button>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncText">מתחבר…</span></div>
  </div>
</header>

<main class="wrap">
  <!-- setup (only until the sheet URL is set) -->
  <section id="vSetup" class="card setup" hidden>
    <h2 style="margin:0">חסר חיבור לגיליון</h2>
    <p style="color:var(--muted);font-size:14px">הדביקו כאן את כתובת ה־Web App של Apps Script (מסתיימת ב־/exec).</p>
    <input id="apiInput" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn" id="apiSave">שמירה</button>
  </section>

  <!-- home: both brothers, then pick your name -->
  <section id="vHome">
    <div class="weekbar"><span id="weekRange"></span><b id="countdown"></b></div>
    <h2 class="sectionTitle" style="margin-top:0">מי סיים מטלה?</h2>
    <div class="kids" id="kidCards"></div>
    <div class="tip" id="tip"></div>
    <button class="ghost" id="toParent">💰 הסיכום השבועי של אמא</button>
  </section>

  <!-- one kid: their Pokémon, the nag, pick the chore -->
  <section id="vKid" hidden>
    <button class="back" id="back1">→ חזרה</button>
    <div id="verdictBox"></div>
    <div class="card hero">
      <img id="kArt" alt="">
      <div class="info">
        <h2 id="kName"></h2>
        <div class="pn" id="kPoke"></div>
        <div class="bar" id="kBar"><i></i><b></b></div>
        <div class="countdown" id="kCountdown"></div>
        <div class="shiny" id="kShiny"></div>
      </div>
    </div>
    <div id="nagBox"></div>
    <h3 class="sectionTitle">המטלות שלי</h3>
    <div class="grid" id="myChores"></div>
    <details class="more" id="moreBox"><summary>מטלות נוספות</summary><div id="otherChores"></div></details>
    <h3 class="sectionTitle">מה עשיתי השבוע</h3>
    <div class="card" style="padding:6px 16px"><ul class="done" id="doneList"></ul></div>
  </section>

  <!-- parent: weekly tally -->
  <section id="vParent" hidden>
    <button class="back" id="back2">→ חזרה</button>
    <h2 class="sectionTitle" style="margin-top:0">הסיכום השבועי</h2>
    <div id="pinBox" class="card">
      <p style="margin:0 0 12px;color:var(--muted);font-size:14px">הקוד של אמא</p>
      <div class="pin"><input id="pinInput" type="password" inputmode="numeric" autocomplete="off"><button class="btn" id="pinBtn">כניסה</button></div>
    </div>
    <div id="parentBody" hidden>
      <div class="totals" id="totals"></div>
      <div id="weeks" style="margin-top:14px"></div>
      <button class="linkish" id="logout">יציאה ממצב הורה</button>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="box">
    <div class="q" id="sheetQ"></div>
    <div class="what" id="sheetWhat"></div>
    <div class="acts"><button class="ok" id="sheetOk"></button><button class="cancel" id="sheetCancel">ביטול</button></div>
  </div>
</div>
<div class="ov" id="ov" hidden>
  <div class="ovBox">
    <div class="ovArt" id="ovArt"></div>
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button class="btn" id="ovBtn"></button>
  </div>
</div>
<div class="help" id="help" hidden>
  <div class="top"><b>איך זה עובד</b><button class="x" id="helpX" aria-label="סגירה">✕</button></div>
  <div class="track" id="helpTrack"></div>
  <div class="foot"><div class="dots" id="helpDots"></div><button class="btn next" id="helpNext">הבא ←</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — the deployed Apps Script Web App URL (…/exec).
   Leave empty to set it in-app on first run.
   ============================================================ */
var DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbxXGwBa8-kC4qWvHHeu4epntCCUQsJ1QX7VqZ8odR6g9RmdbiEHCsFaM2hHykpxe4p6/exec";

var API_URL = store('apiUrl') || DEFAULT_API_URL;
var POLL_MS = 10000;
var SHINY_EVERY = 25;
var KID_COLOR = { 'ליאם':'var(--sky)', 'רובי':'var(--pink)' };
var DAYS = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
var DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

// fallback praise, for chores with no praise lines in the sheet
var PRAISE = [
  'כל הכבוד, {n}! 💪',
  'ה־Ki של {n} עלה! ⚡',
  'עוד לבנה בקיר, {n} 🧱',
  'וו־הו! {n} בעניינים 🍩',
  'אלוף, {n}! 🏆'
];
// behind the week's pace — {p} Pokémon, {day} weekday, {c} chores so far
var PACE_NAGS = [
  '{p} מתחיל לחשוד שאין לו מאמן',
  '{p} פיהק. פעמיים.',
  'יום {day} ו{c}. {p} מאוכזב.',
  '{p} התחיל לצפות בטלוויזיה במקום להתאמן',

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function store(k, v){
  try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){}
  return null;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
function en(s){ return '<span class="en">' + esc(s) + '</span>'; }
// Escape Hebrew text and isolate every English run in it (with its ! or ?), so a
// "D'oh!" or "Magikarp" keeps its place and punctuation inside a right-to-left sentence.
function bidi(s){
  s = String(s == null ? '' : s);
  var re = /[A-Za-z][A-Za-z'’\-]*(?: [A-Za-z][A-Za-z'’\-]*)*[!?]*/g, out = '', last = 0, m;
  while((m = re.exec(s))){ out += esc(s.slice(last, m.index)) + en(m[0]); last = re.lastIndex; }
  return out + esc(s.slice(last));
}
// {placeholders} get pre-built HTML; the text around them goes through bidi()
function fill(t, v){
  return String(t).split(/(\{\w+\})/).map(function(part){
    var k = /^\{(\w+)\}$/.exec(part);
    return k ? (v[k[1]] != null ? v[k[1]] : part) : bidi(part);
  }).join('');
}
function dm(key){ var p = key.split('-'); return (+p[2]) + '.' + (+p[1]); }
function addDays(key, n){ var p = key.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2]+n)).toISOString().slice(0, 10); }
function hash(s){ var h = 0; for(var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function today(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function chores(n){ return n === 0 ? 'אפס מטלות' : n === 1 ? 'מטלה אחת' : n + ' מטלות'; }
// same pick all day for the same key, so a line doesn't change on every 10s refresh
function stablePick(arr, key){ return arr[hash(key + today()) % arr.length]; }
// random, but never the same line twice in a row for this key
function freshPick(arr, key){
  var last = +store('last:' + key), i = Math.floor(Math.random() * arr.length);
  if(arr.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (arr.length - 1))) % arr.length;
  store('last:' + key, String(i));
  return arr[i];
}
// shuffled bag: every reminder shows once before any repeats, and never twice in a row
function nextReminder(){
  var bag; try{ bag = JSON.parse(store('tipBag') || '[]'); }catch(e){ bag = []; }
  bag = bag.filter(function(i){ return i < REMINDERS.length; });
  if(!bag.length){
    bag = REMINDERS.map(function(_, i){ return i; });
    for(var i = bag.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
    var last = +store('tipLast');
    if(bag.length > 1 && bag[bag.length - 1] === last){ bag.unshift(bag.pop()); }
  }
  var pick = bag.pop();
  store('tipBag', JSON.stringify(bag)); store('tipLast', String(pick));
  return REMINDERS[pick];
}
var TIP = nextReminder();

function toast(msg, bad){
  var t = $('toast'); t.innerHTML = bidi(msg); t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(function(){ t.className = 'toast' + (bad ? ' bad' : ''); }, 3200);
}
function setSync(s){
  $('dot').className = 'dot ' + (s === 'live' ? 'live' : s === 'err' ? 'err' : '');
  $('syncText').textContent = s === 'live' ? 'מסונכרן' : s === 'err' ? 'אין חיבור' : 'מתחבר…';
}
function tally(list){
  var m = {}; list.forEach(function(t){ m[t] = (m[t] || 0) + 1; });
  return Object.keys(m).map(function(t){ return m[t] > 1 ? bidi(t) + ' ×' + m[t] : bidi(t); }).join(' · ');
}

/* ---------- the week's Pokémon ---------- */
function target(){ return (data && data.target) || 10; }
function stageOf(n){ return n >= target() ? 2 : n >= Math.ceil(target() / 2) ? 1 : 0; }
// each kid gets a different line each week, fixed for the whole week
function lineFor(week, kid){ return POKE[(hash(week) + Math.max(0, data.kids.indexOf(kid)) * 11) % POKE.length]; }
function art(id, shiny){
  return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + (shiny ? 'shiny/' : '') + id + '.png';
}
function countFor(kid){ return data.entries.filter(function(e){ return e.kid === kid; }).length; }
function weekOf(key){ return (data.history || []).filter(function(w){ return w.week === key; })[0]; }
function dow(){ return new Date().getDay(); }
function behind(n){ return n < Math.floor(target() * dow() / 7); }   // expected pace: target spread over the week
function toNext(n){ var st = stageOf(n); return st === 0 ? Math.ceil(target() / 2) - n : st === 1 ? target() - n : 0; }
function paceNag(kid, n, p){ return fill(stablePick(PACE_NAGS, 'pace' + kid), { p: en(p), day: DAY_NAMES[dow()], c: chores(n) }); }
function daysLeftText(){
  var left = 6 - dow();
  return left <= 0 ? 'הסיכום הערב' : left === 1 ? 'הסיכום מחר בערב' : 'עוד ' + left + ' ימים לסיכום';
}

// Ilana's latest verdict for this kid: this week's, or last week's through Sunday
function verdictFor(kid){
  var cur = weekOf(data.week.start), prev = weekOf(addDays(data.week.start, -7));
  if(cur && cur.kids[kid] && cur.kids[kid].decision) return { w: cur, s: cur.kids[kid] };
  if(dow() === 0 && prev && prev.kids[kid] && prev.kids[kid].decision) return { w: prev, s: prev.kids[kid] };
  return null;
}

/* ---------- API ---------- */
function got(d){
  if(!d || d.ok === false) throw new Error(d && d.error || 'bad response');
  data = d; setSync('live'); render();
  store('cachedData', JSON.stringify(d));
  return d;
}
function load(){
  if(!API_URL){ showSetup(); return; }
  fetch(API_URL).then(function(r){ return r.json(); }).then(got).catch(function(){ setSync('err'); });
}
function post(body){
  // text/plain keeps it a "simple" request, so Apps Script needs no CORS preflight
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) })
    .then(function(r){ return r.json(); }).then(got);
}

/* ---------- routing: #, #kid=<name>, #parent ---------- */
function route(){
  var kid = currentKid(), h = location.hash;
  $('vHome').hidden = !!(kid || h === '#parent');
  $('vKid').hidden = !kid;
  $('vParent').hidden = h !== '#parent';
  if(kid) document.documentElement.style.setProperty('--kc', KID_COLOR[kid] || 'var(--mint)');
  else document.documentElement.style.removeProperty('--kc');
  render();
  window.scrollTo(0, 0);
}
function currentKid(){
  var h = decodeURIComponent(location.hash.slice(1));
  return h.indexOf('kid=') === 0 ? h.slice(4) : '';
}

/* ---------- render ---------- */
function render(){
  if(!data) return;
  var kid = currentKid();
  renderHome();
  if(kid) renderKid(kid);
  if(location.hash === '#parent') renderParent();
}

function setBar(el, n){
  el.querySelector('i').style.width = Math.min(100, n / target() * 100) + '%';
  el.querySelector('b').style.right = (Math.ceil(target() / 2) / target() * 100) + '%';
}

function renderHome(){
  $('weekRange').textContent = 'שבוע ' + dm(data.week.start) + '–' + dm(data.week.end);
  $('countdown').textContent = dow() === 6 ? 'הסיכום הערב! 🌙' : daysLeftText();

  var box = $('kidCards'); box.innerHTML = '';
  data.kids.forEach(function(k){
    var n = countFor(k), line = lineFor(data.week.start, k), st = stageOf(n), p = line[st];
    var status, nag = false;
    if(behind(n)){ status = paceNag(k, n, p[0]); nag = true; }
    else if(st < 2) status = 'עוד ' + chores(toNext(n)) + ' עד ' + en(line[st + 1][0]);
    else status = en(p[0]) + ' מלא 🔥';

    var prev = weekOf(addDays(data.week.start, -7)), last = '';
    if(prev && prev.kids[k]){
      var s = prev.kids[k];
      last = s.decision === 'מגיע' ? '<br>שבוע שעבר: ✓ ' + data.reward + ' ₪'
        : s.decision === 'לא' ? '<br>שבוע שעבר: ✗ ' + en('D\'oh')
        : s.count ? '<br>שבוע שעבר: מחכה לאמא' : '';
    }

    var b = document.createElement('button');
    b.className = 'kid'; b.style.setProperty('--kc', KID_COLOR[k] || 'var(--mint)');
    b.innerHTML = '<img class="pk" src="' + art(p[1]) + '" alt="">' +
      '<div class="nm">' + esc(k) + '</div><div class="pn">' + en(p[0]) + '</div>' +
      '<div class="big">' + n + '<small>/' + target() + '</small></div>' +
      '<div class="bar"><i></i><b></b></div>' +
      '<div class="st' + (nag ? ' nag' : '') + '">' + status + '</div>' +
      '<div class="earned">הרוויח עד היום <b>' + (data.earned[k] || 0) + ' ₪</b>' + last + '</div>';
    setBar(b.querySelector('.bar'), n);
    b.onclick = function(){ location.hash = 'kid=' + encodeURIComponent(k); };
    box.appendChild(b);
  });

  $('tip').innerHTML = '<b>תזכורת 🧠</b>' + bidi(TIP);
}

function praiseFor(c, kid){
  var lines = c && c.praise && c.praise.length ? c.praise : PRAISE;
  return freshPick(lines, 'praise:' + (c ? c.title : '')).replace(/\{n\}/g, kid);
}

function choreBtn(c, kid, counts){
  var b = document.createElement('button'); b.className = 'chore';
  var n = counts[c.title] || 0;
  b.innerHTML = (n ? '<span class="x">×' + n + '</span>' : '') +
    '<span class="em">' + esc(c.emoji) + '</span><span class="t">' + bidi(c.title) + '</span>' +
    (c.hint ? '<span class="h">' + bidi(c.hint) + '</span>' : '');
  b.onclick = function(){
    ask('סיימת את…', c.title, 'כן, סיימתי ✓', freshPick(SAVING, 'saving'), function(){
      var before = countFor(kid), week = data.week.start;
      return post({ action:'add', kid:kid, chore:c.title }).then(function(){
        toast(praiseFor(c, kid));
        var after = countFor(kid), line = lineFor(week, kid), m = (data.month || {})[kid] || 0;
        if(stageOf(after) > stageOf(before)) overlays.push(evolution(kid, line[stageOf(before)], line[stageOf(after)]));
        if(data.month && m > 0 && m % SHINY_EVERY === 0) overlays.push(shiny(kid, line[stageOf(after)], m));
        nextOverlay();
      });
    });
  };
  return b;
}

function renderKid(kid){
  var mine = data.entries.filter(function(e){ return e.kid === kid; });
  var n = mine.length, line = lineFor(data.week.start, kid), st = stageOf(n), p = line[st];
  var counts = {}; mine.forEach(function(e){ counts[e.chore] = (counts[e.chore] || 0) + 1; });

  // hero: this week's Pokémon and the road to the next evolution
  $('kName').textContent = kid;
  $('kArt').src = art(p[1]);
  $('kPoke').innerHTML = en(p[0]) + ' · שלב ' + (st + 1) + ' מתוך 3 · <b style="color:var(--ink)">' + n + '/' + target() + '</b>';
  setBar($('kBar'), n);
  var left = toNext(n);
  $('kCountdown').innerHTML = daysLeftText() + '. ' + (st < 2
    ? 'עוד ' + chores(left) + ' ו־' + en(p[0]) + ' מתפתח ל־' + en(line[st + 1][0]) + '!'
    : en(p[0]) + ' מלא. עכשיו רק לא לבזבז את זה 😎');
  if(data.month){
    var m = data.month[kid] || 0, r = SHINY_EVERY - (m % SHINY_EVERY);
    $('kShiny').textContent = '✨ עוד ' + chores(r) + ' החודש עד להפתעה נדירה';
  } else $('kShiny').textContent = '';

  // Ilana's verdict — a card while it's fresh, and the big reveal once per phone
  var v = verdictFor(kid), vb = $('verdictBox');
  vb.innerHTML = '';
  if(v){
    var yes = v.s.decision === 'מגיע', vl = lineFor(v.w.week, kid)[stageOf(v.s.count)];
    vb.innerHTML = '<div class="card vcard ' + (yes ? 'yes' : 'no') + '"><img src="' + art(vl[1]) + '" alt="">' +
      '<div><div class="t">' + (yes ? 'אמא אישרה! +' + data.reward + ' ₪ 🎉' : bidi('D\'oh! הפעם לא')) + '</div>' +
      '<div class="s">' + (yes ? 'על שבוע ' + dm(v.w.week) + '–' + dm(v.w.end) + ' · ' + chores(v.s.count)
        : 'שבוע חדש, פוקימון חדש, הזדמנות חדשה') + '</div></div></div>';
    var seenKey = 'seen:' + kid + ':' + v.w.week + ':' + v.s.decision;
    if(!store(seenKey)){ store(seenKey, '1'); overlays.push(verdictMoment(kid, yes, vl)); nextOverlay(); }
  }

  // nag: behind the week's pace → name the own chore this kid has neglected longest
  var nb = $('nagBox'); nb.innerHTML = '';
  if(behind(n)){
    var own = data.chores.filter(function(c){ return c.owner === kid; });
    var ld = (data.lastDone || {})[kid] || {};
    own.sort(function(a, b){ return (ld[a.title] || 0) - (ld[b.title] || 0); });
    var worst = own[0], html;
    if(worst && (!ld[worst.title] || data.now - ld[worst.title] > 864e5)){
      var days = ld[worst.title] ? Math.floor((data.now - ld[worst.title]) / 864e5) : 0;
      var lines = worst.nag && worst.nag.length ? worst.nag : null;
      html = '<div class="t">' + esc(worst.emoji) + ' ' + bidi(worst.title) + '</div>' +
        '<div class="d">' + (days ? 'לא נרשם אצלך כבר ' + days + ' ימים' : 'עוד לא נרשם אצלך אף פעם') + '</div>' +
        '<div class="l">' + (lines ? fill(stablePick(lines, 'nag' + kid + worst.title), { n: esc(kid) }) : paceNag(kid, n, p[0])) + '</div>';
    } else {
      html = '<div class="t">⚠️ ' + DAY_NAMES[dow()] + ', ' + chores(n) + '</div><div class="l">' + paceNag(kid, n, p[0]) + '</div>';
    }
    nb.innerHTML = '<div class="card nagbox">' + html + '</div>';
  }

  var my = $('myChores'); my.innerHTML = '';
  data.chores.filter(function(c){ return c.owner === kid; }).forEach(function(c){ my.appendChild(choreBtn(c, kid, counts)); });
  if(!my.children.length) my.innerHTML = '<div class="empty">עוד לא נבחרו מטלות</div>';

  // everything else, grouped by category
  var other = $('otherChores'); other.innerHTML = '';
  var cats = [];
  data.chores.forEach(function(c){ if(c.owner !== kid && cats.indexOf(c.cat) < 0) cats.push(c.cat); });
  cats.forEach(function(cat){
    var t = document.createElement('div'); t.className = 'catTitle'; t.textContent = cat; other.appendChild(t);
    var g = document.createElement('div'); g.className = 'grid';
    data.chores.filter(function(c){ return c.cat === cat && c.owner !== kid; }).forEach(function(c){ g.appendChild(choreBtn(c, kid, counts)); });
    other.appendChild(g);
  });

  var ul = $('doneList'); ul.innerHTML = '';
  if(!mine.length){
    var empty = stablePick(dow() === 0 ? EMPTY_SUNDAY : EMPTY_LATER, 'empty' + kid);
    ul.innerHTML = '<li class="empty" style="display:block">' + fill(empty, { p: en(p[0]) }) + '</li>';
    return;
  }
  mine.slice().sort(function(a, b){ return b.ts - a.ts; }).forEach(function(e){
    var li = document.createElement('li');
    li.innerHTML = '<div><div>' + bidi(e.chore) + '</div><div class="when">יום ' + DAYS[e.day] + ' · ' + esc(e.time) + '</div></div>';
    var u = document.createElement('button'); u.className = 'undo'; u.textContent = 'בטל';
    u.onclick = function(){
      ask('למחוק מהרשימה?', e.chore, 'כן, למחוק', 'מוחק…', function(){
        return post({ action:'delete', id:e.id }).then(function(){ toast('נמחק'); });
      });
    };
    li.appendChild(u); ul.appendChild(li);
  });
}

/* ---------- big moments ---------- */
function evolution(kid, from, to){
  return { art: '<div class="evo"><img class="from" src="' + art(from[1]) + '" alt=""><img class="to" src="' + art(to[1]) + '" alt=""></div>',
    title: 'מה?! ' + en(from[0]) + ' מתפתח!', btn: 'יששש!',
    after: { title: en(to[0]) + '! 🎉', text: esc(kid) + ', ' + en(from[0]) + ' התפתח ל־' + en(to[0]) + '. כל הכבוד למאמן.' },
    text: '…', confetti: false };
}
function shiny(kid, p, m){
  return { art: '<div class="shinyArt"><img src="' + art(p[1], true) + '" alt=""></div>',
    title: '✨ שייני! ✨', btn: 'וואו',
    text: 'מטלה מספר ' + m + ' החודש, ' + esc(kid) + '! ' + en(p[0]) + ' שייני — נדיר כמו חדר מסודר.', confetti: true };
}
function verdictMoment(kid, yes, p){
  return yes
    ? { art: '<img src="' + art(p[1]) + '" alt="">', title: '+' + data.reward + ' ₪ 🎉', btn: 'יאללה!',
        text: 'אמא אישרה את השבוע, ' + esc(kid) + '. ' + en(p[0]) + ' גאה בך.', confetti: true }
    : { art: '<div class="big">🍩</div>', title: en('D\'oh!'), btn: 'שבוע הבא',
        text: 'הפעם אמא לא אישרה, ' + esc(kid) + '. יש שבוע חדש ופוקימון חדש — אפשר להתחיל מחדש.', confetti: false };
}
function nextOverlay(){
  if(!$('ov').hidden || !overlays.length) return;
  var o = overlays.shift();
  $('ovArt').innerHTML = o.art; $('ovTitle').innerHTML = o.title; $('ovText').innerHTML = o.text; $('ovBtn').textContent = o.btn;
  $('ov').hidden = false;
  if(o.after) setTimeout(function(){ $('ovTitle').innerHTML = o.after.title; $('ovText').innerHTML = o.after.text; confetti(); }, 2400);
  if(o.confetti) confetti();
}
$('ovBtn').onclick = function(){ $('ov').hidden = true; nextOverlay(); };
function confetti(){
  var bits = ['🎉','✨','⭐','🟡','🔵','🔴','🟢'];
  for(var i = 0; i < 36; i++){
    var s = document.createElement('span'); s.className = 'confetti';
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    s.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(s);
    setTimeout(function(el){ el.remove(); }, 4200, s);
  }
}

/* ---------- how it works (behind the ? button) ---------- */
function helpSlides(){
  var t = target(), half = Math.ceil(t / 2), reward = (data && data.reward) || 10, ex = POKE[0];
  var evo = ex.map(function(p){ return '<img src="' + art(p[1]) + '" alt="">'; }).join('<span class="arr">←</span>');
  return [
    { c:'var(--mint)', ill:'✅', h:'עשיתם מטלה? רושמים!',
      body:'<ol class="steps"><li><i>1</i>לוחצים על השם שלכם</li><li><i>2</i>לוחצים על המטלה שעשיתם</li>' +
        '<li><i>3</i>מאשרים — ואמא כבר יודעת</li></ol>' +
        '<p class="s">המטלות שבחרתם מופיעות למעלה. עשיתם משהו אחר? הכל נמצא ב"מטלות נוספות". טעיתם? "בטל" ברשימה למטה.</p>' },
    { c:'var(--sky)', ill:evo, h:'הפוקימון של השבוע',
      body:'<p>כל יום ראשון מקבלים פוקימון חדש. הוא מתאמן כשאתם עושים מטלות:</p>' +
        '<p>אחרי <b>' + half + '</b> מטלות הוא מתפתח פעם אחת,<br>ואחרי <b>' + t + '</b> — פעם שנייה.</p>' +
        '<p class="s">במוצאי שבת הפוקימון הולך, וביום ראשון מגיע חדש. אז לא מחכים לסוף השבוע.</p>' },
    { c:'var(--gold)', ill:'✨', h:'הפתעה נדירה',
      body:'<p>כל מטלה מספר <b>' + SHINY_EVERY + '</b> בחודש מביאה משהו מיוחד.</p>' +
        '<p class="s">מה בדיוק? תגיעו ותראו. הספירה מתחילה מחדש בכל ראשון לחודש.</p>' },
    { c:'var(--pink)', ill:'💰', h:'מוצאי שבת: הסיכום',
      body:'<p>במוצאי שבת אמא עוברת על השבוע.<br>אם היא מרוצה — <b>' + reward + ' ₪</b>. היא מחליטה, לא הספירה.</p>' +
        '<p class="s">ואם מפגרים באמצע השבוע? האפליקציה שמה לב. והיא לא שותקת.</p>' },
    { c:'var(--violet)', ill:'🐶', h:'זהו. זה כל הסוד.',
      body:'<p>פחות "כמה פעמים צריך לבקש", יותר זמן לדברים כיפיים.</p>' +
        '<p class="s">שאלות? תשאלו את מודי. היא לא תענה, אבל היא תקשיב.</p>' }
  ];
}
var helpIndex = 0, helpObs = null;
function openHelp(){
  var slides = helpSlides(), track = $('helpTrack'), dots = $('helpDots');
  track.innerHTML = slides.map(function(s){
    return '<section class="slide" style="--c:' + s.c + '"><div class="ill">' + s.ill + '</div><h2>' + s.h + '</h2>' + s.body + '</section>';
  }).join('');
  dots.innerHTML = slides.map(function(){ return '<span></span>'; }).join('');
  $('help').hidden = false;
  track.scrollLeft = 0;
  showHelpDot(0);
  // which card is showing — observed, since RTL scrollLeft differs between browsers
  if(helpObs) helpObs.disconnect();
  helpObs = new IntersectionObserver(function(list){
    list.forEach(function(e){ if(e.isIntersecting) showHelpDot([].indexOf.call(track.children, e.target)); });
  }, { root: track, threshold: 0.6 });
  [].forEach.call(track.children, function(s){ helpObs.observe(s); });
}
function showHelpDot(i){
  helpIndex = i;
  [].forEach.call($('helpDots').children, function(d, j){ d.className = j === i ? 'on' : ''; });
  $('helpNext').textContent = i === $('helpTrack').children.length - 1 ? 'יאללה!' : 'הבא ←';
}
function closeHelp(){ $('help').hidden = true; if(helpObs) helpObs.disconnect(); }
$('helpBtn').onclick = openHelp;
$('helpX').onclick = closeHelp;
$('helpNext').onclick = function(){
  var slides = $('helpTrack').children;
  if(helpIndex >= slides.length - 1) closeHelp();
  else slides[helpIndex + 1].scrollIntoView({ behavior:'smooth', block:'nearest', inline:'start' });
};

/* ---------- parent ---------- */
function renderParent(){
  var pin = store('parentPin');
  $('pinBox').hidden = !!pin;
  $('parentBody').hidden = !pin;
  if(!pin) return;

  $('totals').innerHTML = data.kids.map(function(k){
    return '<div>' + esc(k) + ' הרוויח<b>' + (data.earned[k] || 0) + ' ₪</b></div>';
  }).join('');

  var box = $('weeks'); box.innerHTML = '';
  data.history.forEach(function(w, i){
    var card = document.createElement('div'); card.className = 'card wk';
    card.innerHTML = '<h3>' + (i === 0 ? 'השבוע' : 'שבוע') + ' ' + dm(w.week) + '–' + dm(w.end) + '</h3>' +
      (i === 0 ? '<div class="sub">הסיכום במוצאי שבת. אפשר להחליט כבר עכשיו ולשנות אחר כך.</div>' : '');
    data.kids.forEach(function(k){
      var s = w.kids[k], row = document.createElement('div');
      row.className = 'pk2'; row.style.setProperty('--kc', KID_COLOR[k] || 'var(--mint)');
      row.innerHTML = '<div class="row"><span class="nm">' + esc(k) + '</span><span class="n">' + chores(s.count) + '</span></div>' +
        '<div class="list">' + (s.count ? tally(s.chores) : 'לא נרשמו מטלות') + '</div>';
      var act = document.createElement('div');
      if(s.decision){
        var yes = s.decision === 'מגיע';
        act.className = 'verdict ' + (yes ? 'yes' : 'no');
        act.innerHTML = '<span>' + (yes ? '✓ מגיע ' + data.reward + ' ₪' : '✗ לא השבוע') + '</span>';
        var ch = document.createElement('button'); ch.textContent = 'שינוי';
        ch.onclick = function(){ decide(w.week, k, 'clear'); };
        act.appendChild(ch);
      } else {
        act.className = 'dec';
        var y = document.createElement('button'); y.className = 'yes'; y.textContent = '✓ מגיע ' + data.reward + ' ₪';
        var n = document.createElement('button'); n.className = 'no'; n.textContent = '✗ לא השבוע';
        y.onclick = function(){ decide(w.week, k, 'yes'); };
        n.onclick = function(){ decide(w.week, k, 'no'); };
        act.appendChild(y); act.appendChild(n);
      }
      row.appendChild(act); card.appendChild(row);
    });
    box.appendChild(card);
  });
}

function decide(week, kid, decision){
  post({ action:'decide', pin:store('parentPin'), week:week, kid:kid, decision:decision })
    .then(function(){ toast(decision === 'yes' ? kid + ' קיבל ' + data.reward + ' ₪ 🎉' : 'נשמר'); })
    .catch(function(e){
      if(String(e.message).indexOf('pin') >= 0){ store('parentPin', null); renderParent(); toast('הקוד לא נכון', true); }
      else toast('שגיאה בשמירה — נסו שוב', true);
    });
}

/* ---------- confirm sheet ---------- */
function ask(q, what, okText, busyText, run){
  $('sheetQ').textContent = q; $('sheetWhat').textContent = what; $('sheetOk').textContent = okText;
  pending = { run:run, busy:busyText }; $('sheet').hidden = false;
}
function closeSheet(){ $('sheet').hidden = true; pending = null; }
$('sheetCancel').onclick = closeSheet;
$('sheet').onclick = function(e){ if(e.target === $('sheet')) closeSheet(); };
$('sheetOk').onclick = function(){
  if(!pending) return;
  var btn = $('sheetOk'), label = btn.textContent, p = pending;
  btn.disabled = true; btn.textContent = p.busy;
  p.run().then(closeSheet).catch(function(){ toast('שגיאה בשמירה — נסו שוב', true); })
    .finally(function(){ btn.disabled = false; btn.textContent = label; });
};

/* ---------- parent PIN ---------- */
$('pinBtn').onclick = function(){
  var pin = $('pinInput').value.trim(); if(!pin) return;
  var btn = $('pinBtn'); btn.disabled = true;
  post({ action:'checkPin', pin:pin })
    .then(function(){ store('parentPin', pin); $('pinInput').value = ''; renderParent(); })
    .catch(function(e){ toast(String(e.message).indexOf('no-pin') >= 0 ? 'עוד לא הוגדר קוד בגיליון' : 'הקוד לא נכון', true); })
    .finally(function(){ btn.disabled = false; });
};
$('pinInput').onkeydown = function(e){ if(e.key === 'Enter') $('pinBtn').click(); };
$('logout').onclick = function(){ store('parentPin', null); renderParent(); };

/* ---------- setup ---------- */
function showSetup(){ $('vSetup').hidden = false; $('vHome').hidden = true; setSync('err'); }
$('apiSave').onclick = function(){
  var u = $('apiInput').value.trim(); if(!/^https:\/\/script\.google\.com\//.test(u)){ toast('כתובת לא תקינה', true); return; }
  store('apiUrl', u); API_URL = u; $('vSetup').hidden = true; route(); load(); startPolling();
};

/* ---------- nav + polling ---------- */
$('toParent').onclick = function(){ location.hash = 'parent'; };
$('back1').onclick = $('back2').onclick = function(){ location.hash = ''; };
window.addEventListener('hashchange', route);
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(function(){ if(document.visibilityState === 'visible' && $('sheet').hidden) load(); }, POLL_MS);
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') load(); });

/* ---------- boot ---------- */
try{ var c = JSON.parse(store('cachedData') || 'null'); if(c) data = c; }catch(e){}
route();
load();
startPolling();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
